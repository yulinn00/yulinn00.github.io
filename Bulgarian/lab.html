<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bulgarian Solitaire Laboratory</title>
    <script src="partition.js"></script>
<link rel="stylesheet" href="partition.css">
<style>
body {
    background: #c0c0c0
}

.controls {
    margin-bottom: 20px;
}

#viewport {
    width: 960px;
    height: 600px;
    overflow: auto;
    border: 4px solid #aaa;
    display: flex;
}

#status {
    width: 960px;
    height: 20px;
    overflow: auto;
    border: 4px solid #aaa;
    display: flex;
}


#board {
    position: relative;
    top: 40px;
    width: 800px;
    height: 600px;
    border: 0px solid #aaa;
}

#plist {
    position: relative;
    top: 40px;
    width:  160px;
    height: 600px;
    border: 0px solid #aaa;
    text-align: left;
}


</style>
</head>
<body>
  <div style="position: absolute; top: 6px; left: 20px"><a href="../about.html"><img src="../fun-math-club.gif"/></a></div>
  <h1 style="margin-top: 40px; margin-bottom: 60px; text-align:center">Bulgarian Solitaire Laboratory</h1>
  <div style="text-align: center;">
    <div style="display: grid; grid-template-columns: max-content 1fr; gap: 10px; align-items: center; max-width: 200px; margin:auto; margin-bottom: 6px;">
      <label for="partition" style="justify-self: end;">Partition:</label>
      <input id="partition" name="partition" value="5 3 1">
      <label for="move" style="justify-self: end;">Move:</label>
      <input id="move" name="move" value="B">
    </div>
    B = Bulgarian solitaire, C = conjugate, applied left to right
  </div>
  <div style="margin-top: 20px; text-align: center;">
    <label style="cursor:=pointer;"><input id="disks" type="radio" name="display" value="disks" checked style="cursor:=pointer;">
      Disks</label>
    <label style="cursor:=pointer;"><input id="cards" type="radio" name="display" value="cards" style="cursor:=pointer; margin-left: 20px;">
      Cards</label>
    <label style="cursor:=pointer;"><input id="Ferrers" type="radio" name="display" value="Ferrers" style="cursor:=pointer; margin-left: 20px;">
      Ferrers diagram</label>
    <label style="cursor:=pointer;"><input id="Young" type="radio" name="display" value="Young" style="cursor:=pointer; margin-left: 20px;">
      Young diagram</label>
    <label style="cursor:=pointer;"><input id="funnel" type="radio" name="display" value="Funnel" style="cursor:=pointer; margin-left: 20px;">
      Funnel</label>
  </div>
  <div style="margin-top: 20px; text-align: center;">
    <label style="cursor:=pointer;"><input id="animate" type="radio" name="mode" value="animate" checked style="cursor:=pointer;">
      animate</label>
    <label style="cursor:=pointer;"><input id="step" type="radio" name="mode" value="step" style="cursor:=pointer; margin-left: 20px;">
      step</label>
    <label style="cursor:=pointer;"><input id="skip" type="radio" name="mode" value="skip" style="cursor:=pointer; margin-left: 20px;">
      skip</label>
    <label style="cursor:=pointer;"><input id="jump" type="radio" name="mode" value="jump" style="cursor:=pointer; margin-left: 20px;">
      jump</label>
    <div style="margin-top:10px text-align: center;">
      Speed:
      <input type="range"
	     id="speed"
	     min="1"
	     max="10"
	     value="5">
      <span id="speedValue">5</span>
    </div>
  </div>
  <div style="margin-top: 20px; text-align: center;">
    <label style="cursor: pointer;"><input id="overlap" type="checkbox" name="overlap" value="yes" style="cursor: pointer; " checked>
      overlap stacked items</label>
    <label style="cursor: pointer;"><input id="appendnew" type="checkbox" name="appendnew" value="yes" style="cursor: pointer; margin-left: 20px;" checked>
      add new stack to end</label>
    <label style="cursor: pointer;"><input id="mark" type="checkbox" name="mark" value="yes" style="cursor: pointer; margin-left: 20px;" checked>
      mark moved items</label>
  </div>
  <div style="text-align: center; margin-top: 20px;">
    <button id="start" onclick="onStart()">Start</button>
    <button id="stopresume" onclick="onStopResume()" style="margin-left: 10px;">Stop</button>
    <label style="cursor: pointer;"><input id="continuous" type="checkbox" name="continuous" value="yes" style="cursor: pointer; margin-left: 20px;" checked>
      continuous</label>
  </div>
  <hr style="margin-top:12px; margin-bottom:12px; text-align: center;"/>
  <div style=" display: grid; grid-template-columns: max-content; gap: 10px 10px; justify-content: center;">
    <div id="status" style="margin-top: 20px"></div>
    <div id="viewport" style="margin-top: 0px">
      <div id="board"></div>
      <div id="plist"></div>
    </div>
  </div>
</body>
<script src="lab.js"></script>
</html>
