<!doctype html>

<html>
  <head>
    <title id='title'>recTangle Puzzle</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../fun-math-icon.png">
  </head>
  <body style="background-color:#c0c0c0">
    <div style="position: absolute; top: 6px; left: 20px"><a href="../about.html"><img src="../fun-math-club.gif"/></a></div>
    <h1 id="title-heading" style="margin-top: 40px; margin-bottom: 40px; text-align:center">rec-Tangle Puzzle</h1>
    <div style="text-align:center; font-size:20px; margin-top: 50px">
      <div style="display:grid; grid-template-columns: 320px 600px; text-align: left; align-items: start;">
	<div style="display:grid; grid-template-columns: 320px; justify-items: center;">
	  <canvas id="puzzle" width="600" height="400" style="border:5px solid #ccc;border-radius: 5px;background: black; touch-action: none; margin-top: 30px;"></canvas>
	  <div id="moves" style="font-weight:normal; font-size: 20px; "></div>
	</div>
	<div style="display:grid; grid-template-columns: 480px; text-align: left; align-items: start;">
	  <div style="text-align: center; margin-bottom: 10px;">
	    <input type="button" onclick="undo()" id="undo" value="Undo" style="font-weight:normal; font-size: 12px; ">
	    <span style="margin-left: 20px;"><input type="button" onclick="cv.onHint()" id="hint" value="Hint" style="font-weight:normal; font-size:12px"/></span>
	  </div>
	  <canvas id="board" width="600" height="400" style="border:5px solid #ccc;border-radius: 5px;background: black; touch-action: none;"></canvas>
	</div>
      </div>
    </div>
    </div>
    <script src="./rectigon.js"></script>
    <script src="./rectiles.js"></script>
    <script src="./tangle.js"></script>
    <script>
      window.onload = function() {
	  runPath("board", "zzzPzDlGzjzHzEki.4280");
      }
    </script>

  </body>
</html>
