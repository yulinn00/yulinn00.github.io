<!doctype html>

	  <td/>
	  <td>Progress</td>
	<tr/>
	<tr>
	  <td>
	    <canvas id="goal" width="300" height="200" style="border:5px solid #ccc;border-radius: 5px;background: black;"></canvas>
	  </td>
	  <td></td>
	  <td>
	    <canvas id="variety" width="75" height="50" style="border:5px solid #ccc;border-radius: 5px;background: black;"></canvas>
	  </td>
	</tr>
	<tr>
	  <td>
	    <canvas id="contact-goal" width="80" height="20" style="border:0px;border-radius: 0px"></canvas>
	  </td>
	</tr>

    <hr/>

      <span style="margin-left: 20px;" id="solve"><input type="button" onclick="squares.onSolve()" value="Solve" style="font-weight:normal; font-size:12px"/></span>
    </div>
    <div style="display: flex; justify-content: center;">
      <canvas id="board" width="600" height="400" style="border:5px solid #ccc;border-radius: 5px;background: black; margin-top:20px; touch-action: none;"></canvas>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; margin-top: 10px; margin-bottom: 40px;">

      <input style="margin-left: 20px; width:40px; height: 40px" type=color id="color2" value="#3030e0">
      <input style="margin-left: 20px; font-weight:normal; font-size:12px;" type="button" onclick="squares.onResetColors()" value="Reset colors" id="reset"/>
