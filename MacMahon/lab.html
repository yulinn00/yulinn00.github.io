<!doctype html>

<html>
<head>
    <title>MacMahon Squares Laboratory</title>
    <script src="./utils.js"></script>
    <script src="./macmahon.js"></script>
    <script src="./lab.js"></script>
</head>
<body style="background-color:#c0c0c0">
    <div style="text-align:center">
      <h1>MacMahon Squares Laboratory</h1>
      <div style="margin-top:20px;">
	<table align="center">
	  <tr>
	    <td style="text-align:right">Tile Set:</td>
	    <td style="text-align:right">
	      <select id="tiles">
	      </select>
	    </td>
	    <td style="text-align:left">
	      <span id="tiles-description"></span></td>
	  </tr>
	  <tr>
	    <td style="text-align:right">Rectangle Dimensions:</td>
	    <td style="text-align:right">
	      <select id="dim">
	      </select>
	    </td>
	  </tr>
	</table>
      </div>
      <div style="text-align:center; font-size:20px; margin-top: 40px">
	<table align="center">
	  <col width="45%">
	  <col width="10%">
	  <col width="45%">
	  <tr>
	    <td>Goal</td>
	    <td/>
	    <td>Progress</td>
	  <tr/>
	  <tr>
	    <td>
	      <canvas id="goal" width="300" height="200" style="border:2px solid #ffffff;border-radius: 5px;background: black;"></canvas>
	    </td>
	    <td></td>
	    <td>
	      <canvas id="variety" width="75" height="50" style="border:5px solid #c0c0c0; border-radius: 5px;background: black;"></canvas>
	    </td>
	  </tr>
	  <tr>
	    <td>
	      <canvas id="contact-goal" width="80" height="20" style="border:2px solid #ffffff; border-radius: 0px"></canvas>
	    </td>
	  </tr>
	</table>
      </div>
      <hr/>
      <div style="text-align: center; margin-top: 40px">
	<input type="button" onclick="squares.onUndo()" value="Undo" style="font-weight:normal; font-size:12px;" id="undo"/>
	<input type="button" onclick="squares.onToggleFreeze()" value="Freeze/unfreeze a tile" style="font-weight:normal; font-size:12px; margin-left: 20px" id="toggle-freeze"/>
      </div>
      <div style="display: flex; justify-content: center;">
	<canvas id="board" width="600" height="400" style="border:5px solid #ccc;border-radius: 5px;background: black; margin-top:20px;"></canvas>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; margin-top: 20px;">
	<table>
	  <tr>
	    <td style="text-align: left;">
	      Puzzle code: <span id="board-value" style="margin-left:5px;"></span>
	    </td>
	    <td>
	      <input type="button" onclick="squares.onCopy()" value="Copy to clipboard" style="font-weight:normal; font-size:12px; margin-left: 20px;" id="copy"/>
	    </td>
	  </tr>
	  <tr>
	    <td style="text-align: left;">
	      <label>
		<input type="checkbox" id="URI-safe" onclick="squares.onURIsafe()" style="font-weight:normal; font-size:12px;" />
		URI safe
	      </label>
	    </td>
	  </tr>
	</table>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; margin-top: 10px; margin-bottom: 40px;">
	<input style="width:40px; height: 40px" type=color id="color0" value="#d00000">
	<input style="margin-left: 20px; width:40px; height: 40px" type=color id="color1" value="#e0e000">
	<input style="margin-left: 20px; width:40px; height: 40px" type=color id="color2" value="#3030e0">
	<input style="margin-left: 20px; font-weight:normal; font-size:12px;" type="button" onclick="squares.onResetColors()" value="Reset colors" id="reset"/>
      </div>
    </div>

    <script>
    window.onload = function() {
        squares = new Lab({size: 100});
	squares.run();
    }
    </script>

</body>
