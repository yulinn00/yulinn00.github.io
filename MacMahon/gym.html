<!doctype html>

<html>
<head>
    <title id="title">Percy's Puzzles</title>
    <script src="./utils.js"></script>
    <script src="./macmahon.js"></script>
    <script src="./puzzle.js"></script>
</head>
<body style="background-color:#c0c0c0">
  <h1 id="title-heading" style="text-align:center;">Practice Solving Percy's Puzzles</h1>
  <div id="nextdiv">
    <input type="button" onclick="squares.onNext()" id="next" value="Next" style="font-weight:normal; font-size:12px">
  </div>
  <div style="text-align:center; font-size:20px; margin-top: 40px">
    <table align="center">
      <col width="45%">
      <col width="10%">
      <col width="45%">
      <tr>
	<td>Goal</td>
	<td/>
	<td>Progress</td>
      <tr/>
      <tr>
	<td>
	  <canvas id="goal" width="300" height="200" style="border:5px solid #ccc;border-radius: 5px;background: black;"></canvas>
	</td>
	<td></td>
	<td>
	  <canvas id="variety" width="75" height="50" style="border:5px solid #ccc;border-radius: 5px;background: black;"></canvas>
	</td>
      </tr>
      <tr>
	<td>
	  <canvas id="contact-goal" width="80" height="20" style="border:0px;border-radius: 0px"></canvas>
	</td>
      </tr>
    </table>
  </div>
  <hr/>
  <div style="text-align: center; margin-top: 40px">
    <input type="button" onclick="squares.onUndo()" id="undo" value="Undo" style="font-weight:normal; font-size:12px">
    <span style="margin-left: 20px;"><input type="button" onclick="squares.onHint()" id="hint" value="Hint" style="font-weight:normal; font-size:12px"/></span>
    <span style="margin-left: 20px;" id="solve"><input type="button" onclick="squares.onSolve()" value="Solve" style="font-weight:normal; font-size:12px"/></span>
  </div>
  <div style="display: flex; justify-content: center;">
    <canvas id="board" width="600" height="400" style="border:5px solid #ccc;border-radius: 5px;background: black; margin-top:20px;"></canvas>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; margin-top: 10px; margin-bottom: 40px;">
    <input style="width:40px; height: 40px" type=color id="color0" value="#d00000">
    <input style="margin-left: 20px; width:40px; height: 40px" type=color id="color1" value="#e0e000">
    <input style="margin-left: 20px; width:40px; height: 40px" type=color id="color2" value="#3030e0">
    <input style="margin-left: 20px; font-weight:normal; font-size:12px;" type="button" onclick="squares.onResetColors()" value="Reset colors" id="reset"/>
  </div>
  <script>
    window.onload = function() {
	squares = new Percy();
	squares.run(
		["c3nr84[_2D.b",
 		"db}W-2yU94*nQ.c",
 		"cR[)hCs{8b",
 		"d9H5yCW+V{w*uU@c2.fi",
 		"d_nz-2yU94m}D",
 		"f^eAGD4gY3spZ-_lK;].gc",
 		"f9PHen!CzyUmud};ck2.h"]);
    }
  </script>
</body>
